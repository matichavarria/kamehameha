
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kamehameha Rush by MatiGarro</title>
  <style>
    body { background: black; color: white; font-family: sans-serif; text-align: center; }
    button { font-size: 20px; padding: 10px 20px; margin-top: 30px; border: none; border-radius: 10px; background: #2196F3; color: white; }
    #power { font-size: 24px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Kamehameha Rush by MatiGarro</h1>
  <div>
    <button onclick="cargarKi()">Cargar Ki</button>
    <div id="power">Poder: 0</div>
  </div>
  <audio id="bgMusic" src="audio/music.mp3" autoplay loop></audio>
  <script>
    let poder = 0;
    function cargarKi() {
      poder += 10;
      document.getElementById('power').innerText = 'Poder: ' + poder;
    }
  </script>
</body>
</html>
